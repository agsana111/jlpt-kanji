name: Daily study reminder

on:
  schedule:
    # 23:50 UTC = 08:50 KST, so it usually lands around 9:00 even with GitHub's schedule delay
    - cron: "50 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock web-push@3.6.7
        working-directory: notify
      - run: node send.mjs
        working-directory: notify
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
